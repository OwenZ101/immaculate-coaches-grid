<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Immaculate Coaches Grid</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #111827; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 12px 48px; }
  .board { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .grid { display: grid; grid-template-columns: 120px repeat(3, 150px); grid-template-rows: 96px repeat(3, 140px); gap: 10px; }
  .corner, .head { display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; line-height: 1.15; font-size: 14px; padding: 6px; }
  .corner { font-size: 13px; color: #cbd5e1; }
  img.logo { display: block; }
  .cell { background: #1f2937; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid transparent; }
  .cell:hover { border-color: #4b5563; }
  .cell.sel { border-color: #60a5fa; }
  .cell.filled { background: #14532d; cursor: default; }
  .cell.revealed { background: #450a0a; color: #fca5a5; cursor: pointer; }
  .row.static { cursor: default; }
  #answersOverlay { z-index: 30; }
  .res-panel { padding: 24px 20px 20px; text-align: center; }
  .res-score { font-size: 48px; font-weight: 800; color: #f1f5f9; line-height: 1; }
  .res-score small { font-size: 22px; color: #9ca3af; font-weight: 600; }
  .res-imm { margin-top: 8px; font-size: 18px; font-weight: 800; color: #22c55e; letter-spacing: .08em; }
  .res-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 18px 0 16px; }
  .res-tile { font: inherit; font-size: 13px; font-weight: 700; line-height: 1.2; color: #fff; background: #16a34a; border: 0; border-radius: 8px; padding: 8px 6px; min-height: 62px; cursor: pointer; }
  .res-tile.missed { background: #7f1d1d; color: #fecaca; }
  .res-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .res-hint { margin-top: 14px; font-size: 12px; color: #9ca3af; }
  #endBox { display: flex; justify-content: center; margin-top: 12px; }
  .ans-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #374151; }
  .ans-head .ttl { font-weight: 700; font-size: 15px; color: #f1f5f9; }
  .ans-head .sub { font-size: 12px; color: #9ca3af; margin-top: 3px; }
  .ans-close { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: #374151; border: 0; padding: 7px 14px; border-radius: 8px; cursor: pointer; }
  .cell small { color: #9ca3af; font-weight: 400; font-size: 12px; }
  .side { text-align: center; min-width: 140px; }
  .side .label { font-size: 13px; font-weight: 700; color: #cbd5e1; letter-spacing: .05em; text-transform: uppercase; }
  .side .num { font-size: 60px; font-weight: 800; line-height: 1.1; margin: 4px 0 12px; }
  .btn { font: inherit; font-weight: 600; color: #fff; background: #2563eb; border: 0; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #374151; cursor: not-allowed; }
  .msg { text-align: center; min-height: 1.5em; margin-top: 16px; font-size: 15px; }
  .msg.ok { color: #86efac; } .msg.bad { color: #fca5a5; }
  .rules { text-align: center; color: #9ca3af; font-size: 13px; margin-top: 18px; line-height: 1.5; }
  .end { text-align: center; margin-top: 12px; font-weight: 700; font-size: 17px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 10; }
  .overlay.open { display: flex; }
  .panel { width: min(580px, 94vw); background: #374151; border-radius: 14px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.5); }
  .searchbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #2d3748; border-bottom: 1px solid #4b5563; }
  .searchbar input { flex: 1; font: inherit; font-size: 18px; background: transparent; border: 0; outline: 0; color: #fff; }
  .searchbar input::placeholder { color: #9ca3af; }
  .results { max-height: 420px; overflow-y: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 16px; cursor: pointer; }
  .row.active { background: #4b5563; }
  .nm.wrong { color: #fca5a5; }
  .row .nm { font-size: 16px; font-weight: 600; }
  .row .sub { font-size: 12px; color: #9ca3af; margin-top: 3px; }
  .row .pick { font: inherit; font-size: 14px; font-weight: 600; color: #fff; background: #16a34a; border: 0; padding: 7px 14px; border-radius: 8px; white-space: nowrap; }
  .hint { padding: 18px 16px; color: #9ca3af; font-size: 14px; }
  .tip { position: absolute; display: none; z-index: 20; background: #eceef1; color: #1f2937; padding: 12px 18px; border-radius: 6px; font-size: 16px; line-height: 1.5; text-align: center; width: max-content; max-width: 440px; box-shadow: 0 6px 18px rgba(0,0,0,.35); transform: translateX(-50%); }
  .tip.open { display: block; }

  @media (max-width: 600px) {
    .wrap { display: flex; flex-direction: column; justify-content: center; min-height: 100vh; min-height: 100svh; padding-block: 28px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
    .page-title { font-size: 26px; font-weight: 800; text-align: center; color: #f1f5f9; letter-spacing: .04em; margin: 0 0 4px; }
    .page-title-accent { color: #22c55e; }
    .board { margin-top: 12px; }
    .rules { margin-top: 28px; font-size: 11px; }
    .board { flex-direction: column; gap: 14px; }
    .grid { grid-template-columns: 56px repeat(3, minmax(0, 1fr)); grid-template-rows: 64px repeat(3, auto); gap: 6px; width: 100%; min-width: 0; }
    .cell { font-size: 12px; padding: 4px; aspect-ratio: 1 / 1; min-height: 0; height: auto; }
    .tip { font-size: 12px; max-width: 86vw; white-space: normal; padding: 9px 12px; }
    .cell small { font-size: 10px; }
    .head { font-size: 11px; padding: 3px; }
    .corner { font-size: 10px; text-transform: none; letter-spacing: 0; }
    img.logo { width: auto !important; height: auto !important; max-width: 46px; max-height: 46px; }
    .head:has(img.logo) { padding: 4px; }
    .side { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; min-width: 0; width: 100%; }
    .sidebtns { flex-direction: row !important; flex-wrap: wrap; justify-content: center; }
    .sidebtns .btn { padding: 10px 12px; font-size: 15px; }
    .side .btn { padding: 12px 22px; }
    .side .num { font-size: 40px; margin: 0; }
    .side > div { margin-top: 0 !important; }
    #gridInfo { width: 100%; text-align: center; max-width: none; }
    .msg { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="page-title">IMMACULATE <span class="page-title-accent">COACHES</span></h1>
  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="side">
      <div class="label">Guesses left</div>
      <div class="num" id="lives">9</div>
      <button class="btn" id="giveUp">Give Up</button>
      <div style="margin-top:14px;font-size:14px;color:#cbd5e1">Filled <span id="count">0</span>/9</div>
      <div class="sidebtns" style="margin-top:14px;display:flex;flex-direction:column;gap:8px;align-items:center">
        <button class="btn" id="dailyBtn" style="background:#374151">Daily grid</button>
        <button class="btn" id="newBtn" style="background:#374151">New grid</button>
        <button class="btn" id="shareBtn" style="background:#374151">Copy link</button>
      </div>
      <div id="gridInfo" style="margin-top:10px;font-size:12px;color:#9ca3af;max-width:150px"></div>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div id="endBox"></div>
</div>

<div id="teamTip" class="tip"></div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="searchbar">
      <span style="color:#9ca3af;font-size:18px">&#128269;</span>
      <input id="search" type="text" placeholder="Search any NFL head coach..." autocomplete="off" spellcheck="false">
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="panel res-panel">
    <div class="res-score" id="resScore"></div>
    <div class="res-imm" id="resImm">IMMACULATE!</div>
    <div class="res-grid" id="resGrid"></div>
    <div class="res-actions">
      <button class="btn" id="resShare">Share today's grid</button>
      <button class="btn" id="resClose" style="background:#374151">Close</button>
    </div>
    <div class="res-hint">Tap any square to see the correct coaches.</div>
  </div>
</div>

<div class="overlay" id="answersOverlay">
  <div class="panel">
    <div class="ans-head">

      <button class="ans-close" id="ansClose">Close</button>
    </div>
    <div class="results" id="ansList" style="max-height:60vh"></div>
  </div>
</div>

$("answersOverlay").addEventListener("click", function (e) { if (e.target === $("answersOverlay")) closeAnswers(); });

var PLAY_URL = "https://owenz101.github.io/immaculate-coaches-grid/";
var DAILY_EPOCH = Date.UTC(2026, 9, 29); // Oct 29, 2026 = daily grid #1
function dailyNumber() {
  var p = todayPhoenix().split("-");
  return Math.round((Date.UTC(+p[0], +p[1] - 1, +p[2]) - DAILY_EPOCH) / 86400000) + 1;
}
function shareText() {
  var score = st.filled.filter(Boolean).length;
  var title = currentCode ? "Immaculate Coaches (" + currentCode + ")" : "Immaculate Coaches #" + dailyNumber();
  var lines = ["\uD83C\uDFC8 " + title + " " + score + "/9:"];
  if (score === 9) lines.push("IMMACULATE!");
  for (var i = 0; i < 3; i++) {
    var row = "";
    for (var j = 0; j < 3; j++) row += st.filled[i * 3 + j] ? "\uD83D\uDFE9" : "\uD83D\uDFE5";
    lines.push(row);
  }
  lines.push("Play at:");
  lines.push(currentCode ? PLAY_URL + "?g=" + currentCode : PLAY_URL);
  return lines.join("\n");
}
function openResults() {
  var score = st.filled.filter(Boolean).length;
  $("resScore").innerHTML = score + "<small>/9</small>";
  $("resImm").style.display = score === 9 ? "block" : "none";
  var html = "";
  for (var idx = 0; idx < 9; idx++) {
    var name = st.filled[idx];
    html += '<button class="res-tile' + (name ? "" : " missed") + '" data-idx="' + idx + '">' + esc(name || "Missed") + "</button>";
  }
  $("resGrid").innerHTML = html;
  $("resShare").textContent = currentCode ? "Share this grid" : "Share today's grid";
  $("resultOverlay").classList.add("open");
}
function closeResults() { $("resultOverlay").classList.remove("open"); }
$("resClose").addEventListener("click", closeResults);
$("resultOverlay").addEventListener("click", function (e) { if (e.target === $("resultOverlay")) closeResults(); });
$("resGrid").addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest(".res-tile") : null;
  if (t) openAnswers(Number(t.getAttribute("data-idx")));
});
$("endBox").addEventListener("click", function (e) { if (e.target.id === "viewResults") openResults(); });
$("resShare").addEventListener("click", function () {
  var text = shareText();
  function copyFallback() {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { setMsg("Result copied to clipboard.", "ok"); }).catch(function () {});
  }
  if (navigator.share) {
    navigator.share({ text: text }).catch(function (err) { if (!err || err.name !== "AbortError") copyFallback(); });
  } else {
    copyFallback();
  }
});

function endGame() {
  st.over = true;
  for (var idx = 0; idx < 9; idx++) {
    if (st.filled[idx]) continue;
    st.revealed[idx] = "Missed";
  }
  st.sel = null;
  render();
  $("endBox").innerHTML = '<button class="btn" id="viewResults">View results</button>';
  $("giveUp").disabled = true;
  openResults();
}

// ---------- events ----------
function showTip(el, lines, key) {
  var tip = $("teamTip");
  tip.dataset.key = key;
  tip.innerHTML = lines.map(function (l) { return "<div>" + esc(l) + "</div>"; }).join("");
  tip.classList.add("open");
  var r = el.getBoundingClientRect();
  // Keep the tooltip fully on screen, even when the header sits near an edge.
  var w = tip.offsetWidth, center = r.left + r.width / 2;
  center = Math.max(w / 2 + 12, Math.min(window.innerWidth - w / 2 - 12, center));
  tip.style.left = (center + window.scrollX) + "px";
  tip.style.top = (r.bottom + window.scrollY + 8) + "px";
}
function closeTeam() { $("teamTip").classList.remove("open"); }

$("grid").addEventListener("click", function (e) {
  var logo = e.target.closest ? e.target.closest("img.logo") : null;
  var head = e.target.closest ? e.target.closest(".head[data-cat]") : null;
  if (logo || head) {
    var key = logo ? "team:" + logo.getAttribute("data-team") : "cat:" + head.getAttribute("data-cat");
    var tipEl = $("teamTip");
    if (tipEl.classList.contains("open") && tipEl.dataset.key === key) { closeTeam(); }
    else if (logo) { showTip(logo, TEAM_INFO[logo.getAttribute("data-team")] || [], key); }
    else { showTip(head, CAT_INFO[head.getAttribute("data-cat")] || [], key); }
    return;
  }
  var cell = e.target.closest ? e.target.closest(".cell") : null;
  if (!cell || !st) return;
  var idx = Number(cell.getAttribute("data-idx"));
  if (st.over) { openAnswers(idx); return; }
  if (st.filled[idx] || st.revealed[idx]) return;
  setMsg("");
  openSearch(idx);
});
$("search").addEventListener("input", updateResults);
$("search").addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown") { e.preventDefault(); if (shownMatches.length) setHighlight(Math.min(hiIndex + 1, shownMatches.length - 1)); }
  else if (e.key === "ArrowUp") { e.preventDefault(); if (shownMatches.length) setHighlight(Math.max(hiIndex - 1, 0)); }
  else if (e.key === "Enter") { e.preventDefault(); if (shownMatches[hiIndex]) submitName(shownMatches[hiIndex].n); }
  else if (e.key === "Escape") { closeSearch(false); }
});
$("results").addEventListener("click", function (e) {
  var row = e.target.closest ? e.target.closest(".row") : null;
  if (!row) return;
  var i = Number(row.getAttribute("data-i"));
  if (shownMatches[i]) submitName(shownMatches[i].n);
});
$("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeSearch(false); });
document.addEventListener("click", function (e) {
  if (e.target && e.target.closest && e.target.closest("img.logo, .head[data-cat]")) return;
  closeTeam();
});
$("giveUp").addEventListener("click", function () { if (st && !st.over) endGame(); });
$("newBtn").addEventListener("click", function () { loadGrid(randomCode()); });
$("dailyBtn").addEventListener("click", function () { loadGrid(null); });
$("shareBtn").addEventListener("click", copyLink);
window.onerror = function (msg) { setMsg("Script error: " + msg, "bad"); };

initFromUrl();
</script>
</body>
</html>
